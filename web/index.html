<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGLC4 Citation Tool</title>
    <style>
        :root {
            --color-primary: #1e40af;
            --color-primary-light: #3b82f6;
            --color-success: #16a34a;
            --color-warning: #ea580c;
            --color-error: #dc2626;
            --color-border: #d1d5db;
            --color-bg: #ffffff;
            --color-bg-secondary: #f9fafb;
            --color-text: #111827;
            --color-text-secondary: #6b7280;
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-bg: #1f2937;
                --color-bg-secondary: #111827;
                --color-text: #f3f4f6;
                --color-text-secondary: #9ca3af;
                --color-border: #374151;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        .subtitle {
            color: var(--color-text-secondary);
            font-size: 1rem;
        }

        .upload-section {
            background-color: var(--color-bg-secondary);
            border: 2px dashed var(--color-border);
            border-radius: 8px;
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: var(--color-primary);
            background-color: var(--color-bg);
        }

        .upload-section.dragover {
            border-color: var(--color-primary-light);
            background-color: var(--color-bg);
        }

        .file-input {
            display: none;
        }

        .upload-text {
            font-size: 1.1rem;
            margin-bottom: var(--spacing-sm);
        }

        .upload-subtext {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="file"],
        select {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            font-size: 0.95rem;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        button {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-light);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--color-bg-secondary);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background-color: var(--color-border);
        }

        .loading {
            display: none;
            text-align: center;
            margin: var(--spacing-xl) 0;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
            margin-top: var(--spacing-xl);
        }

        .summary {
            background-color: var(--color-bg-secondary);
            padding: var(--spacing-lg);
            border-radius: 4px;
            margin-bottom: var(--spacing-lg);
        }

        .summary-stat {
            display: inline-block;
            margin-right: var(--spacing-xl);
        }

        .summary-stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color-primary);
        }

        .summary-stat-label {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        .warning-list {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid color-mix(in srgb, var(--color-warning) 35%, transparent);
            border-radius: 6px;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 4px;
            margin-bottom: var(--spacing-lg);
        }

        .warning-list.dark-mode {
            background-color: #78350f;
            color: #fcd34d;
        }

        .warning-item {
            margin-bottom: var(--spacing-sm);
        }

        .warning-item:last-child {
            margin-bottom: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: var(--spacing-lg);
            font-size: 0.95rem;
        }

        th, td {
            text-align: left;
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--color-border);
        }

        th {
            background-color: var(--color-bg-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        tr.changed {
            background-color: #fef3c7;
        }

        tr.changed em {
            font-style: italic;
        }

        @media (prefers-color-scheme: dark) {
            tr.changed {
                background-color: #78350f;
            }
        }

        tr:hover {
            background-color: var(--color-bg-secondary);
        }

        .collapsible-row {
            cursor: pointer;
        }

        .collapsible-row:hover {
            background-color: var(--color-bg-secondary);
        }

        .toggle-icon {
            display: inline-block;
            margin-right: var(--spacing-sm);
            transition: transform 0.2s;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        .hidden-row {
            display: none;
        }

        .bibliography {
            margin-bottom: var(--spacing-xl);
        }

        .bibliography h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .bibliography-entry {
            margin-left: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            font-family: var(--font-serif);
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid color-mix(in srgb, var(--color-error) 35%, transparent);
            border-radius: 6px;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 4px;
            margin-bottom: var(--spacing-lg);
            display: none;
        }

        .error.dark-mode {
            background-color: #7f1d1d;
            color: #fecaca;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid color-mix(in srgb, var(--color-success) 35%, transparent);
            border-radius: 6px;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 4px;
            margin-bottom: var(--spacing-lg);
            display: none;
        }

        .success.dark-mode {
            background-color: #064e3b;
            color: #bbf7d0;
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }

            h1 {
                font-size: 1.5rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: var(--spacing-sm);
            }

            .summary-stat {
                display: block;
                margin-bottom: var(--spacing-md);
            }
        }

        em {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AGLC4 Citation Tool</h1>
            <p class="subtitle">Format legal citations in Word documents to the Australian Guide to Legal Citation</p>
        </header>

        <div class="upload-section" id="uploadSection">
            <div class="upload-text">Drop your .docx file here or click to select</div>
            <div class="upload-subtext">Maximum 10 MB</div>
            <input type="file" id="fileInput" class="file-input" accept=".docx" />
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="modelSelect">AI Model</label>
                <input type="text" id="modelSelect" placeholder="Loading providers..." list="modelList" />
                <datalist id="modelList"></datalist>
            </div>

            <div class="control-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="trackChanges" checked />
                    <label for="trackChanges">Track changes</label>
                </div>
            </div>

            <div class="control-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="bibliography" checked />
                    <label for="bibliography">Generate bibliography</label>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="processButton">Process</button>
            <button class="btn-secondary" id="downloadButton" style="display: none;">Download</button>
        </div>

        <div class="error" id="errorMessage"></div>
        <div class="success" id="successMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing document...</p>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="summary" id="summary"></div>
            <div id="warnings"></div>
            <h2>Footnotes</h2>
            <table id="footnotes">
                <thead>
                    <tr>
                        <th style="width: 50px;">No.</th>
                        <th>Original</th>
                        <th>AGLC4</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="bibliography"></div>
        </div>
    </div>

    <script>
        // State
        let currentSessionId = null;
        let currentFilename = null;
        let isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;

        // Initialize
        document.addEventListener("DOMContentLoaded", async () => {
            setupUpload();
            setupControls();
            await loadProviders();
        });

        // Load providers
        async function loadProviders() {
            try {
                const response = await fetch("/api/providers");
                if (!response.ok) throw new Error("Failed to load providers");

                const data = await response.json();
                const select = document.getElementById("modelSelect");
                const datalist = document.getElementById("modelList");

                // Set default
                select.placeholder = data.default;
                select.value = data.default;

                // Populate datalist
                datalist.innerHTML = data.providers
                    .map(p => `<option value="${p}"></option>`)
                    .join("");
            } catch (error) {
                console.error("Error loading providers:", error);
                showError("Failed to load LLM providers");
            }
        }

        // Setup upload
        function setupUpload() {
            const section = document.getElementById("uploadSection");
            const input = document.getElementById("fileInput");

            section.addEventListener("click", () => input.click());
            section.addEventListener("dragover", (e) => {
                e.preventDefault();
                section.classList.add("dragover");
            });
            section.addEventListener("dragleave", () => section.classList.remove("dragover"));
            section.addEventListener("drop", (e) => {
                e.preventDefault();
                section.classList.remove("dragover");
                if (e.dataTransfer.files[0]) {
                    input.files = e.dataTransfer.files;
                    handleFileSelected();
                }
            });

            input.addEventListener("change", handleFileSelected);
        }

        function handleFileSelected() {
            const input = document.getElementById("fileInput");
            const file = input.files[0];
            if (file) {
                currentFilename = file.name;
                document.getElementById("uploadSection").textContent = `Selected: ${file.name}`;
            }
        }

        // Setup controls
        function setupControls() {
            document.getElementById("processButton").addEventListener("click", processDocument);
            document.getElementById("downloadButton").addEventListener("click", downloadDocument);
        }

        // Process document
        async function processDocument() {
            const file = document.getElementById("fileInput").files[0];
            if (!file) {
                showError("Please select a .docx file");
                return;
            }

            clearMessages();
            showLoading(true);

            try {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("model", document.getElementById("modelSelect").value || "");
                formData.append("track_changes", document.getElementById("trackChanges").checked);
                formData.append("bibliography", document.getElementById("bibliography").checked);

                const response = await fetch("/api/process", {
                    method: "POST",
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Processing failed");
                }

                const result = await response.json();
                currentSessionId = result.id;

                displayResults(result);
                showSuccess("Document processed successfully");
                document.getElementById("downloadButton").style.display = "inline-block";
            } catch (error) {
                console.error("Error:", error);
                showError(error.message || "Error processing document");
            } finally {
                showLoading(false);
            }
        }

        // Display results
        function displayResults(result) {
            const section = document.getElementById("resultsSection");
            section.style.display = "block";

            // Summary
            const changed = result.footnotes.filter(fn => fn.changed).length;
            const total = result.footnotes.length;
            document.getElementById("summary").innerHTML = `
                <div class="summary-stat">
                    <div class="summary-stat-value">${changed}/${total}</div>
                    <div class="summary-stat-label">Footnotes Changed</div>
                </div>
            `;

            // Warnings
            const warningsDiv = document.getElementById("warnings");
            if (result.warnings && result.warnings.length > 0) {
                const darkClass = isDarkMode ? "dark-mode" : "";
                warningsDiv.innerHTML = `
                    <div class="warning-list ${darkClass}">
                        <strong>Warnings:</strong>
                        ${result.warnings.map(w => `
                            <div class="warning-item">
                                ${w.footnote ? `Footnote ${w.footnote}: ` : ""}${escapeHtml(w.message)}
                            </div>
                        `).join("")}
                    </div>
                `;
            } else {
                warningsDiv.innerHTML = "";
            }

            // Footnotes table
            const tbody = document.querySelector("#footnotes tbody");
            tbody.innerHTML = result.footnotes.map((fn, idx) => {
                const changed = fn.changed ? "changed" : "";
                const nextRow = result.footnotes[idx + 1];
                const isLast = idx === result.footnotes.length - 1;
                const isChanged = fn.changed;
                const shouldCollapse = !isChanged && idx > 0;

                return `
                    <tr class="${changed} ${shouldCollapse ? "collapsible-row" : ""}" data-footnote="${fn.number}">
                        <td>${fn.number}</td>
                        <td>${fn.original_html}</td>
                        <td>${fn.formatted_html}</td>
                    </tr>
                `;
            }).join("");

            // Setup collapsible rows
            document.querySelectorAll(".collapsible-row").forEach(row => {
                row.addEventListener("click", () => {
                    const nextRow = row.nextElementSibling;
                    if (nextRow && !nextRow.classList.contains("collapsible-row")) {
                        nextRow.classList.toggle("hidden-row");
                    }
                });
            });

            // Bibliography
            const bibDiv = document.getElementById("bibliography");
            if (result.bibliography && result.bibliography.length > 0) {
                bibDiv.innerHTML = `
                    <div class="bibliography">
                        ${result.bibliography.map(section => `
                            <h3>${escapeHtml(section.heading)}</h3>
                            ${section.entries.map(entry => `
                                <div class="bibliography-entry">${entry}</div>
                            `).join("")}
                        `).join("")}
                    </div>
                `;
            } else {
                bibDiv.innerHTML = "";
            }
        }

        // Download document
        async function downloadDocument() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`/api/download/${currentSessionId}`);
                if (!response.ok) throw new Error("Download failed");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = currentFilename ? currentFilename.replace(".docx", ".aglc.docx") : "document.aglc.docx";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("Error:", error);
                showError("Failed to download document");
            }
        }

        // Utilities
        function showLoading(show) {
            document.getElementById("loading").style.display = show ? "block" : "none";
            document.getElementById("processButton").disabled = show;
        }

        function showError(message) {
            const el = document.getElementById("errorMessage");
            el.textContent = message;
            el.style.display = "block";
            if (isDarkMode) el.classList.add("dark-mode");
        }

        function showSuccess(message) {
            const el = document.getElementById("successMessage");
            el.textContent = message;
            el.style.display = "block";
            if (isDarkMode) el.classList.add("dark-mode");
        }

        function clearMessages() {
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("successMessage").style.display = "none";
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
