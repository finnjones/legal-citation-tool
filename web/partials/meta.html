<link rel="canonical" href="{{canonical}}">
    <meta property="og:type" content="{{og_type}}">
    <meta property="og:site_name" content="{{brand}}">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:image" content="{{base_url}}/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A footnote before and after AGLC4 formatting, shown as a tracked change.">
    <meta property="og:locale" content="en_AU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{og_title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{base_url}}/assets/og.png">
    {{jsonld}}
