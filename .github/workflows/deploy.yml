name: Test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest tests/ -q

  deploy:
    name: Deploy to homelab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, linux, x64, legal-citation-deploy]
    timeout-minutes: 15
    concurrency:
      group: legal-citation-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i /opt/actions-runner/.ssh/legal_citation_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            deployer@legal-citation.home "deploy ${DEPLOY_SHA}"
